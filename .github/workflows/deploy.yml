name: Deploy prepared production release

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact 40-character reviewed commit to release
        required: true
        type: string
      confirmation:
        description: "Enter deploy:writeoff-23910:<release_commit>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: writeoff-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production
      url: https://writeoffapp.com
    steps:
      - name: Check out the exact reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0

      - name: Verify manual release confirmation
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          test "$ACTUAL_COMMIT" = "$RELEASE_COMMIT"
          test "$RELEASE_CONFIRMATION" = "deploy:writeoff-23910:$ACTUAL_COMMIT"

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install release preparation dependencies
        run: npm ci --include=dev

      - name: Materialize private reviewed release inputs
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          PRODUCTION_MIGRATION_REVIEW_JSON: ${{ secrets.PRODUCTION_MIGRATION_REVIEW_JSON }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_ENV_FILE"
          test -n "$PRODUCTION_MIGRATION_REVIEW_JSON"
          umask 077
          printf '%s' "$PRODUCTION_ENV_FILE" > "$RUNNER_TEMP/writeoff-production.env"
          printf '%s' "$PRODUCTION_MIGRATION_REVIEW_JSON" > "$RUNNER_TEMP/writeoff-production-migration-review.json"
          node scripts/prepare-production-release.mjs \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/writeoff-production-release" \
            --env-file "$RUNNER_TEMP/writeoff-production.env" \
            --migration-review "$RUNNER_TEMP/writeoff-production-migration-review.json"

      - name: Configure Firebase deployment identity
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/writeoff-production-service-account.json"

      - name: Build and deploy the coordinated release
        working-directory: ${{ runner.temp }}/writeoff-production-release
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          # Scoped to this step only; the deploy script also withholds it from install/build scripts.
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/writeoff-production-service-account.json
        run: npm run production:deploy -- --confirm "deploy:writeoff-23910:$RELEASE_COMMIT"

      - name: Remove private release material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/writeoff-production-release"
          rm -f "$RUNNER_TEMP/writeoff-production.env"
          rm -f "$RUNNER_TEMP/writeoff-production-migration-review.json"
          rm -f "$RUNNER_TEMP/writeoff-production-service-account.json"
