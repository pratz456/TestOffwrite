name: CI

on:
  push:
    branches: [main, master, feb-new, march-branch, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI never receives provider credentials or opts into live evaluations.
      NEXT_TELEMETRY_DISABLED: '1'
      WRITEOFF_LIVE_AI_EVAL: '0'
      WRITEOFF_BANK_EMULATOR_TESTS: '0'
      WRITEOFF_RULES_EMULATOR_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            functions-analysis/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --include=dev
          npm --prefix functions ci --include=dev
          npm --prefix functions-analysis ci --include=dev

      # Runtime dependencies must carry no known critical vulnerability with an upstream fix.
      # Build-time findings that need a major upgrade are tracked in docs/compliance/WISP_2026-09-17.md (G8).
      - name: Audit all three production dependency trees
        run: |
          failed=0
          for directory in . functions functions-analysis; do
            npm --prefix "$directory" audit --omit=dev --audit-level=critical || failed=1
          done
          exit "$failed"

      - name: Lint
        run: npm run lint

      - name: Unit and contract tests
        run: npm test

      - name: Build application without provider access
        env:
          # Build-only demo configuration, based on scripts/local-demo.mjs.
          # Client emulator mode intentionally requires development; this build
          # uses a separate fictitious project and is never hosted or served.
          WRITEOFF_ENV: 'ci'
          NEXT_PUBLIC_APP_ENV: 'ci'
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS: 'false'
          GCLOUD_PROJECT: 'demo-writeoff-ci'
          GOOGLE_CLOUD_PROJECT: 'demo-writeoff-ci'
          GOOGLE_APPLICATION_CREDENTIALS: '${{ runner.temp }}/no-cloud-credentials.json'
          FIREBASE_CONFIG: '{"projectId":"demo-writeoff-ci","storageBucket":"demo-writeoff-ci.appspot.com"}'
          FIREBASE_STORAGE_BUCKET: 'demo-writeoff-ci.appspot.com'
          FIREBASE_AUTH_EMULATOR_HOST: '127.0.0.1:9099'
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8180'
          FIREBASE_STORAGE_EMULATOR_HOST: '127.0.0.1:9299'
          NEXT_PUBLIC_FIREBASE_API_KEY: 'demo-key'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'demo-writeoff-ci'
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'demo-writeoff-ci.firebaseapp.com'
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: 'demo-writeoff-ci.appspot.com'
          NEXT_PUBLIC_FIREBASE_APP_ID: 'demo-app'
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: 'G-CI-ONLY'
          NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
          PLAID_ENV: 'sandbox'
          AI_ANALYSIS_ENABLED: 'false'
        run: npm run build

      # Next generates route types during the application build.
      - name: Typecheck application
        run: npx --no-install tsc --noEmit

      - name: Build scheduled sync worker
        run: npm --prefix functions run build

      - name: Build analysis worker
        run: npm --prefix functions-analysis run build

  # Separate from `ci`, which leaves emulator files skipped.
  # demo-organizer-maintenance is a demo project id, so this emulator stays
  # offline and cannot reach a hosted Firebase project. No credentials are used.
  # firebase-tools is the locked devDependency, started with npx --no-install.
  # Storage is included because the rules emulator file checks Storage rules.
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run emulator tests
        run: |
          # Local config only. The repo firebase.json hosts the app from source, which this
          # emulator refuses to build, and it has no auth block. This file is not used to deploy.
          node <<'EOF'
          const { writeFileSync } = require('node:fs');
          writeFileSync('firebase.emulator-ci.json', JSON.stringify({
            firestore: { rules: 'firestore.rules', indexes: 'firestore.indexes.json' },
            storage: { rules: 'storage.rules' },
            auth: {},
            emulators: {
              auth: { host: '127.0.0.1', port: 9099 },
              firestore: { host: '127.0.0.1', port: 8080 },
              storage: { host: '127.0.0.1', port: 9199 },
              ui: { enabled: false },
              singleProjectMode: true,
            },
          }));
          EOF
          status=0
          npx --no-install firebase emulators:exec --only firestore,auth,storage --project demo-organizer-maintenance --config firebase.emulator-ci.json \
            'WRITEOFF_RULES_EMULATOR_TESTS=1 WRITEOFF_BANK_EMULATOR_TESTS=1 WRITEOFF_RULES_PROJECT_ID=demo-organizer-maintenance WRITEOFF_BANK_EMULATOR_PROJECT=demo-organizer-maintenance WRITEOFF_RULES_FIRESTORE_PORT=8080 WRITEOFF_RULES_STORAGE_PORT=9199 npx vitest run --no-file-parallelism --reporter=default --reporter=json --outputFile.json=/tmp/emulator-vitest.json tests/*.emulator.test.ts' \
            || status=$?
          rm -f firebase.emulator-ci.json
          exit "$status"

      - name: Require every emulator test to run
        run: |
          node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync("/tmp/emulator-vitest.json", "utf8"));
          const passed = report.numPassedTests ?? 0;
          const skipped = (report.numPendingTests ?? 0) + (report.numTodoTests ?? 0);
          const failed = report.numFailedTests ?? 0;
          console.log(JSON.stringify({ passed, skipped, failed, total: report.numTotalTests ?? 0 }));
          if (passed < 1 || skipped !== 0 || failed !== 0 || report.success !== true) process.exit(1);
          '
