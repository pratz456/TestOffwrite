name: CI

on:
  push:
    branches: [main, master, feb-new]
  pull_request:
    branches: [main, master, feb-new]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint, test, and build
        run: npm run ci
